<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPIIZ | Recuperar Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #6A1C32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- ANIMACIONES OPTIMIZADAS --- */
        @keyframes smoothEnter {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes smoothExit {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
        }

        /* Contenedor de la sombra */
        .card-wrapper {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            box-shadow: 0 0 15px 3px rgba(255, 255, 255, 0.4), 0 10px 25px rgba(0,0,0,0.5);
            background-color: #ffffff;
            /* Entrada elegante y ágil (0.6s) */
            animation: smoothEnter 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Salida rápida para evitar el "brinco" (0.5s) */
        .card-wrapper.animating-out {
            animation: smoothExit 0.5s cubic-bezier(0.32, 0, 0.67, 0) forwards !important;
        }

        .container-card {
            display: flex;
            width: 100%;
            background-color: transparent;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .left-content {
            flex: 1;
            background: #4A1322;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .left-content img {
            width: 350px;
            margin-bottom: 25px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
        }

        .left-content h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .left-content p {
            font-size: 1.1rem;
            font-weight: 400;
            margin: 0;
        }

        .form-box {
            flex: 1;
            padding: 40px;
            position: relative;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-box::before {
            content: "";
            background-image: url('/imagenes/Escudo_ipn.png');
            background-size: 50%;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            pointer-events: none;
            z-index: 0;
        }

        .form-wrapper {
            position: relative;
            z-index: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        input {
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: #fafafa;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
            box-sizing: border-box;
            width: 100%;
        }

        input:focus {
            border-color: #6A1C32;
            background-color: #ffffff;
            box-shadow: 0 0 5px rgba(106, 28, 50, 0.3);
            outline: none;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background: #6A1C32;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button[type="submit"]:hover {
            background: #4A1322;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #6A1C32;
            text-decoration: none;
            font-weight: 600;
            line-height: 2;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card-wrapper">
    <div class="container-card">
        <div class="left-content">
            <img th:src="@{/imagenes/IPN-Logo.png}" alt="Logo IPN">
            <h1>INSTITUTO POLITÉCNICO NACIONAL</h1>
            <p>Sistema de Gestión de Trabajos Terminales</p>
        </div>

        <div class="form-box">
            <div class="form-wrapper">
                <h2 style="text-align: center; color: #6A1C32; margin-bottom: 10px;">Recuperar Contraseña</h2>
                <p style="text-align: center; color: #666; font-size: 0.95rem; margin-bottom: 25px;">
                    Ingresa el correo con el que te registraste y te enviaremos un enlace para restablecer tu acceso.
                </p>

                <form id="formRecuperar">
                    <div class="form-group">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" placeholder="Ingresa tu correo" required>
                    </div>

                    <button type="submit" id="btnEnviar">Enviar Instrucciones</button>
                </form>

                <div class="footer-links">
                    <a th:href="@{/login}">Regresar al Inicio de Sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Petición AJAX para enviar el correo
    document.getElementById('formRecuperar').addEventListener('submit', function(e) {
        e.preventDefault();

        const correo = document.getElementById('correo').value.trim();
        const btn = document.getElementById('btnEnviar');

        // Desactivamos el botón para evitar doble clic
        btn.disabled = true;
        btn.innerHTML = 'Enviando...';

        fetch('/api/auth/olvide-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo })
        })
        .then(res => res.json())
        .then(data => {
            Swal.fire({
                icon: 'success',
                title: '¡Correo enviado!',
                text: data.mensaje,
                confirmButtonColor: '#6A1C32'
            }).then(() => {
                // Hacemos la animación de salida programada
                document.querySelector('.card-wrapper').classList.add('animating-out');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 500);
            });
        })
        .catch(error => {
            console.error('Error:', error);
            btn.disabled = false;
            btn.innerHTML = 'Enviar Instrucciones';
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Hubo un problema al procesar tu solicitud.',
                confirmButtonColor: '#6A1C32'
            });
        });
    });

    // Transición de salida suave para el botón de regresar
    document.querySelectorAll('.footer-links a').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const destino = this.href;
            const cardWrapper = document.querySelector('.card-wrapper');

            cardWrapper.classList.add('animating-out');

            // El timeout coincide con los 0.5s de la animación smoothExit
            setTimeout(() => {
                window.location.href = destino;
            }, 500);
        });
    });
</script>
</body>
</html>
