<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPIIZ | Sistema TT - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #6A1C32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; /* Evita que salga barra de scroll durante la animación */
        }

        /* --- ANIMACIONES SUAVES Y FLUIDAS (Fade & Slide) --- */
        @keyframes smoothEnter {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.98); /* Entra desde un poco más arriba y ligeramente más chica */
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes smoothExit {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(40px) scale(0.98); /* Se va hundiendo y desvaneciendo */
            }
        }

        /* El contenedor principal de toda la tarjeta */
        .card-wrapper {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            box-shadow: 0 0 15px 3px rgba(255, 255, 255, 0.4), 0 10px 25px rgba(0,0,0,0.5);
            background-color: #ffffff;
            /* Animación de entrada fluida de 1 segundo */
            animation: smoothEnter 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Clase para la salida */
        .card-wrapper.animating-out {
            /* Animación de salida fluida */
            animation: smoothExit 0.8s cubic-bezier(0.32, 0, 0.67, 0) forwards !important;
        }

        /* Contenedor interno sin animación (para que no haga doble efecto) */
        .container-card {
            display: flex;
            width: 100%;
            background-color: transparent;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .left-content {
            flex: 1;
            background: #4A1322;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .left-content img {
            width: 350px;
            margin-bottom: 25px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
        }

        .left-content h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .left-content p {
            font-size: 1.1rem;
            font-weight: 400;
            margin: 0;
        }

        .form-box {
            flex: 1;
            padding: 40px;
            position: relative;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-box::before {
            content: "";
            background-image: url('/imagenes/Escudo_ipn.png');
            background-size: 50%;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            pointer-events: none;
            z-index: 0;
        }

        .form-wrapper {
            position: relative;
            z-index: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        input {
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: #fafafa;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
            box-sizing: border-box;
            width: 100%;
        }

        input:focus {
            border-color: #6A1C32;
            background-color: #ffffff;
            box-shadow: 0 0 5px rgba(106, 28, 50, 0.3);
            outline: none;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background: #6A1C32;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button[type="submit"]:hover {
            background: #4A1322;
        }

        .footer-links {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #6A1C32;
            text-decoration: none;
            font-weight: 600;
            line-height: 2;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Estilos para el contenedor de la contraseña y el ojito */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 40px;
            width: 100%;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #6A1C32;
        }
    </style>
</head>
<body>

<div class="card-wrapper">
    <div class="container-card">
        <div class="left-content">
            <img th:src="@{/imagenes/IPN-Logo.png}" alt="Logo IPN">
            <h1>INSTITUTO POLITÉCNICO NACIONAL</h1>
            <p>Sistema de Gestión de Trabajos Terminales</p>
        </div>

        <div class="form-box">
            <div class="form-wrapper">
                <h2 style="text-align: center; color: #6A1C32; margin-bottom: 25px;">Iniciar Sesión</h2>

                <form id="formLogin">
                    <div class="form-group">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" placeholder="Ingresa tu correo registrado" required>
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña:</label>
                        <div class="password-wrapper">
                            <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('contrasena', this)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit">Ingresar</button>
                </form>

                <div class="footer-links">
                    <a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a><br>
                    <span style="color: #666; font-size: 0.9rem;">¿Aún no tienes cuenta? <br> <a th:href="@{/registro}" style="font-size: 1.1rem; color: #4A1322;">Regístrate aquí</a></span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/dist/js/js_propios/login.js}"></script>
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const eyeSlash = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
        const eyeOpen = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = eyeSlash;
        } else {
            input.type = 'password';
            btn.innerHTML = eyeOpen;
        }
    }

    // Transición de salida suave
    document.querySelectorAll('.footer-links a').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const destino = this.href;
            const cardWrapper = document.querySelector('.card-wrapper');

            // Le agregamos la clase para que se desvanezca
            cardWrapper.classList.add('animating-out');

            // Esperamos 800ms (lo mismo que dura la animación) y mandamos a la otra página
            setTimeout(() => {
                window.location.href = destino;
            }, 800);
        });
    });
</script>
</body>
</html>
