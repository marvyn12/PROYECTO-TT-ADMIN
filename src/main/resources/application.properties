# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
spring.application.name=gestion-tt
server.port=8081

# ==========================================
# CONEXIÓN A BASE DE DATOS MYSQL
# ==========================================
# Cambia 'tu_contraseña' por la contraseña de tu servidor MySQL local (si usas XAMPP suele ir vacío)
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_tt?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=//
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN DE CORREO (GMAIL)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Pon el correo desde donde saldrán los mensajes
spring.mail.username=hdtgsj3@gmail.com
# Recuerda que aquí va la "Contraseña de Aplicación" de Google, no tu contraseña normal
spring.mail.password=AQUI_VA_MI_PASS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ==========================================
# 'update' lee tus clases del paquete 'model' y crea/modifica las tablas automáticamente en MySQL
spring.jpa.hibernate.ddl-auto=update
# Esto imprime en consola las consultas SQL (muy útil para debugear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true